name: Deploy Frontend

on:
  push:
    branches: [develop, main]
    paths:
      - "frontend/**"
      - "shared/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch: {}

permissions:
  id-token: write # required for AWS OIDC
  contents: read

env:
  AWS_REGION: eu-west-2

jobs:
  deploy:
    runs-on: ubuntu-latest
    # develop -> the "development" GitHub Environment (dev bucket/distribution/bot),
    # main -> "production" — each environment holds its own set of vars below.
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Build frontend
        run: npm run build --workspace frontend
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_TELEGRAM_BOT_USERNAME: ${{ vars.VITE_TELEGRAM_BOT_USERNAME }}
          VITE_AVATAR_CDN_BASE_URL: ${{ vars.VITE_AVATAR_CDN_BASE_URL }}
          # Drives frontend/scripts/generate-seo-files.mjs (postbuild): only the prod
          # deploy gets a crawlable robots.txt + sitemap.xml, so dev.dnaclub.com.ua never
          # ends up duplicated in Google's index alongside the real site.
          SITE_ENV: ${{ github.ref_name == 'main' && 'production' || 'development' }}
          # frontend/scripts/prerender.mjs (postbuild): saves every sitemap page as static
          # HTML under dist/_pre/, rendered in the runner's preinstalled Chrome.
          PRERENDER: "1"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Two passes, so each kind of file gets the cache lifetime it can afford:
      # - assets/: every file name carries a content hash and never changes, so browsers
      #   keep it for a year. No --delete: a visitor still on the previous version loads
      #   its lazy chunks (admin, Mini App) by their old names after this deploy.
      # - everything else (HTML, prerendered pages, robots/sitemap, public/ images):
      #   browsers revalidate on every visit (a cheap 304), CloudFront keeps it a day —
      #   the invalidation below clears it on each deploy.
      - name: Sync to S3
        run: |
          aws s3 sync frontend/dist/assets "s3://${{ vars.FRONTEND_BUCKET }}/assets" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 sync frontend/dist "s3://${{ vars.FRONTEND_BUCKET }}" --delete \
            --exclude "assets/*" \
            --cache-control "public,max-age=0,s-maxage=86400,must-revalidate"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
