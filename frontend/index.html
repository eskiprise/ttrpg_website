<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dice &amp; Adventures Club — настільні рольові ігри у Вінниці</title>
    <meta
      name="description"
      content="Клуб настільних рольових ігор у Вінниці. D&amp;D, Delta Green, Dragonbane та ще 21 система. 236 зіграних сесій, середня оцінка 8.9/10. Новачків навчимо за столом — приносити нічого не треба."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dice &amp; Adventures Club" />
    <meta property="og:title" content="Настільні рольові ігри у Вінниці" />
    <meta
      property="og:description"
      content="236 зіграних сесій, 24 системи, середня оцінка 8.9/10. Ігри щотижня — приходьте на свою першу."
    />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:url" content="https://dnaclub.com.ua/" />
    <!-- Link previews (Telegram, Facebook, Viber…) need an ABSOLUTE image URL, so this
         points at prod even on dev. 1200×630 is the size every platform expects. -->
    <meta property="og:image" content="https://dnaclub.com.ua/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dice &amp; Adventures Club — настільні рольові ігри у Вінниці" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dnaclub.com.ua/og-image.jpg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Onest:wght@400;500;600&family=Unbounded:wght@700;800&display=swap"
    />
    <script>
      // Set the theme class before first paint, so there's no flash of the
      // wrong theme while React mounts (see src/theme/ThemeContext.tsx).
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
    <!-- Official Telegram Mini App SDK. Harmless outside Telegram — window.Telegram.WebApp
         just has no real WebView behind it, so the /telegram page detects that and shows
         a "open this from the bot" message instead. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
