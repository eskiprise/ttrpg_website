<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Google Search Console site-ownership verification — the "Google Analytics" method
         couldn't find gtag.js because it's loaded conditionally/dynamically below rather
         than as a static snippet, so this is the HTML-tag method instead. -->
    <meta name="google-site-verification" content="ynRUqG_xsUFBu55Sg_10zycW00tQf08_rYAomFecffw" />
    <!-- Google Analytics (gtag.js). Google's snippet, loaded only on the public prod site:
         dev, localhost and the Telegram Mini App (club members, not visitors) would
         otherwise mix into the numbers the site is meant to measure. Route changes need
         nothing extra — GA4's enhanced measurement tracks history navigation. -->
    <script>
      (function () {
        if (location.hostname !== "dnaclub.com.ua" || location.pathname.startsWith("/telegram")) return;
        var id = "G-2GKBDZTV11";
        var tag = document.createElement("script");
        tag.async = true;
        tag.src = "https://www.googletagmanager.com/gtag/js?id=" + id;
        document.head.appendChild(tag);
        window.dataLayer = window.dataLayer || [];
        window.gtag = function () {
          window.dataLayer.push(arguments);
        };
        window.gtag("js", new Date());
        window.gtag("config", id);
      })();
    </script>
    <title>Настільні рольові ігри та D&amp;D у Вінниці — Dice &amp; Adventures Club</title>
    <meta
      name="description"
      content="Клуб настільних рольових ігор (НРІ) у Вінниці. D&amp;D (ДнД), Delta Green, Dragonbane та ще 21 система. 236 зіграних сесій, середня оцінка 8.9/10. Новачків навчимо за столом — приносити нічого не треба."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dice &amp; Adventures Club" />
    <meta property="og:title" content="Настільні рольові ігри у Вінниці" />
    <meta
      property="og:description"
      content="236 зіграних сесій, 24 системи, середня оцінка 8.9/10. Ігри щотижня — приходьте на свою першу."
    />
    <meta property="og:locale" content="uk_UA" />
    <meta property="og:url" content="https://dnaclub.com.ua/" />
    <!-- Link previews (Telegram, Facebook, Viber…) need an ABSOLUTE image URL, so this
         points at prod even on dev. 1200×630 is the size every platform expects. -->
    <!-- ?v=N: Telegram/Facebook cache a link preview per image URL, so bump it whenever
         og-image.jpg changes or new shares keep showing the old picture. -->
    <meta property="og:image" content="https://dnaclub.com.ua/og-image.jpg?v=2" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Dice &amp; Adventures Club — настільні рольові ігри у Вінниці" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://dnaclub.com.ua/og-image.jpg?v=2" />

    <!-- Local-business structured data, for Google Maps / local search. Static and
         site-wide rather than per-page — the club itself, not any one page, is the
         subject. Hours are "every day, 09:00–24:00"; closes as 23:59 since some parsers
         reject a literal "24:00". -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Dice & Adventures Club",
        "alternateName": "DnA Club",
        "knowsAbout": [
          "Настільні рольові ігри",
          "Dungeons & Dragons",
          "Dragonbane",
          "Daggerheart",
          "Delta Green",
          "Cosmere RPG",
          "Vampire: The Masquerade"
        ],
        "url": "https://dnaclub.com.ua/",
        "image": "https://dnaclub.com.ua/og-image.jpg?v=2",
        "description": "Клуб настільних рольових ігор (НРІ) у Вінниці. D&D (ДнД), Delta Green, Dragonbane та ще 21 система. 236 зіграних сесій, середня оцінка 8.9/10. Новачків навчимо за столом — приносити нічого не треба.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "вул. Дмитра Майбороди, 2",
          "addressLocality": "Вінниця",
          "addressCountry": "UA"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 49.2331919,
          "longitude": 28.4397303
        },
        "hasMap": "https://maps.app.goo.gl/JSUTWUYu536BGBceA",
        "sameAs": ["https://t.me/Guchara"],
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": [
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
            "Sunday"
          ],
          "opens": "09:00",
          "closes": "23:59"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Onest:wght@400;500;600&family=Unbounded:wght@700;800&display=swap"
    />
    <script>
      // Set the theme class before first paint, so there's no flash of the
      // wrong theme while React mounts (see src/theme/ThemeContext.tsx).
      (function () {
        var stored = localStorage.getItem("theme");
        var isDark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
        if (isDark) document.documentElement.classList.add("dark");
      })();
    </script>
    <!-- Official Telegram Mini App SDK. Harmless outside Telegram — window.Telegram.WebApp
         just has no real WebView behind it, so the /telegram page detects that and shows
         a "open this from the bot" message instead. -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
